services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_INSTALL_DOCKER_CLI: "1"
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: dkr-oclaw-gtw
    user: "1000:1002"  # Run as node user with docker group for sandbox support
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_WORKSPACE_DIR: ${OPENCLAW_WORKSPACE_DIR}
      OPENCLAW_CONFIG_DIR: ${OPENCLAW_CONFIG_DIR}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ${OPENCLAW_WORKSPACE_DIR}:${OPENCLAW_WORKSPACE_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    init: true
    restart: unless-stopped
    entrypoint: ["node", "dist/index.js"]
    command:
      [
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}",
      ]

  openclaw-sandbox-browser:
    image: openclaw-sandbox-browser:local
    container_name: openclaw-sandbox-browser
    ports:
      - "9222:9222"  # CDP
      - "5900:5900"  # VNC
      - "6080:6080"  # noVNC
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}/sandbox-browser:/tmp/openclaw-home/.chrome
    environment:
      - OPENCLAW_BROWSER_CDP_PORT=9222
      - OPENCLAW_BROWSER_VNC_PORT=5900
      - OPENCLAW_BROWSER_NOVNC_PORT=6080
      - OPENCLAW_BROWSER_ENABLE_NOVNC=1
      - OPENCLAW_BROWSER_HEADLESS=0
      - OPENCLAW_BROWSER_SCREEN_RESOLUTION=${OPENCLAW_BROWSER_SCREEN_RESOLUTION:-3840x2160}
      - OPENCLAW_BROWSER_NO_SANDBOX=1
    tmpfs:
      - /tmp/.X11-unix
    restart: unless-stopped
